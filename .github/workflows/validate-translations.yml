name: Validate zh-TW translations

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout language pack
        uses: actions/checkout@v4
      - name: Check translation structure and placeholders
        run: python3 scripts/validate_translations.py
